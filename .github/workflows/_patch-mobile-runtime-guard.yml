name: Targeted mobile runtime repair on preview
on:
  push:
    branches:
      - fix/mobile-runtime-guard-20261019
    paths:
      - .github/workflows/_patch-mobile-runtime-guard.yml
permissions:
  contents: write
jobs:
  patch-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Remove obsolete desktop relocation calls and validate the page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, tempfile
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s
          symbol = 'relocateDesktopContactServices'
          occurrences = s.count(symbol)
          if occurrences != 3:
              raise SystemExit(f'Expected the 2 obsolete calls and 1 resize callback, found {occurrences}; no edit made.')
          call = '    relocateDesktopContactServices();'
          if s.count(call) != 2:
              raise SystemExit(f'Expected exactly two direct obsolete calls, found {s.count(call)}.')
          s = s.replace(call, '    /* No relocation needed: the duplicate desktop contact host was removed. */', 2)
          resize = """    window.addEventListener('resize', function(){
                clearTimeout(window.__abqContactRelocateTimer);
                window.__abqContactRelocateTimer=setTimeout(relocateDesktopContactServices,120);
              });
          """
          if s.count(resize) != 1:
              # Match the block independent of indentation, while verifying only one complete stale handler.
              import re
              pattern = re.compile(r"\s*window\.addEventListener\('resize',\s*function\(\)\{\s*clearTimeout\(window\.__abqContactRelocateTimer\);\s*window\.__abqContactRelocateTimer=setTimeout\(relocateDesktopContactServices,120\);\s*\}\);")
              s, count = pattern.subn('', s, count=1)
              if count != 1:
                  raise SystemExit(f'Could not locate exactly one obsolete resize handler (matched {count}).')
          else:
              s = s.replace(resize, '', 1)
          if symbol in s:
              raise SystemExit('A stale reference remains; no commit made.')
          if s == original:
              raise SystemExit('No changes generated.')
          p.write_text(s, encoding='utf-8')
          # Syntax-check the inline JS block containing tab navigation / initHistory.
          marker = 'function applyTab('
          pos = s.find(marker)
          script_start = s.rfind('<script', 0, pos)
          tag_end = s.find('>', script_start)
          script_end = s.find('</script>', tag_end)
          if min(pos, script_start, tag_end, script_end) < 0 or not (script_start < pos < script_end):
              raise SystemExit('Could not isolate the tab-history script for syntax validation.')
          js_path = Path(tempfile.gettempdir()) / 'tab-history-validate.js'
          js_path.write_text(s[tag_end+1:script_end], encoding='utf-8')
          subprocess.run(['node', '--check', str(js_path)], check=True)
          print('Removed obsolete desktop relocation calls and resize callback.')
          print('Validated the script containing applyTab/initHistory.')
          PY
          git diff --check
      - name: Install browser for a free mobile viewport smoke test
        run: |
          mkdir -p /tmp/mobile-audit
          npm install --prefix /tmp/mobile-audit playwright
          /tmp/mobile-audit/node_modules/.bin/playwright install --with-deps chromium
      - name: Smoke-test the repaired page at a phone viewport
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mobile-audit/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          cat > /tmp/mobile-audit/mobile-check.cjs <<'JS'
          const { chromium, devices } = require('/tmp/mobile-audit/node_modules/playwright');
          async function main() {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({...devices['iPhone 13'], locale:'ar-EG'});
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            await page.goto('http://127.0.0.1:8765/index.html?mobile_fix_audit=1', {waitUntil:'domcontentloaded', timeout:60000});
            await page.waitForTimeout(1800);
            const result = await page.evaluate(() => {
              const button = document.querySelector('#abq-audio-welcome-btn');
              const rect = button ? button.getBoundingClientRect() : null;
              const style = button ? getComputedStyle(button) : null;
              const active = document.querySelector('.main-tabs-content .tab-active');
              return {
                viewportWidth: document.documentElement.clientWidth,
                documentWidth: document.documentElement.scrollWidth,
                horizontalOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 1,
                title: document.title,
                welcomeButtonFound: !!button,
                welcomeButtonVisible: !!button && !!rect && rect.width > 0 && rect.height > 0 && style.display !== 'none' && style.visibility !== 'hidden',
                welcomeButtonLabel: button ? button.innerText.trim() : null,
                welcomeButtonY: rect ? Math.round(rect.y) : null,
                welcomeButtonInsideInitialViewport: !!rect && rect.y < window.innerHeight && rect.bottom > 0,
                navButtonCount: document.querySelectorAll('.main-tabs-nav .nav-btn').length,
                activeTabId: active ? active.id : null,
                relocationSymbolPresentInPageScripts: Array.from(document.scripts).some(s => s.textContent.includes('relocateDesktopContactServices'))
              };
            });
            console.log('MOBILE_AFTER_FIX_JSON=' + JSON.stringify({result, pageErrors:errors}));
            await browser.close();
            if (result.horizontalOverflow) throw new Error('Phone viewport has horizontal overflow.');
            if (errors.some(e => e.includes('relocateDesktopContactServices'))) throw new Error('The obsolete relocation error still occurs.');
            if (!result.welcomeButtonFound || !result.welcomeButtonVisible) throw new Error('Welcome audio button is missing or invisible.');
          }
          main().catch(e=>{console.error(e);process.exit(1);});
          JS
          set +e
          node /tmp/mobile-audit/mobile-check.cjs | tee /tmp/mobile-audit/mobile-output.txt
          TEST_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$TEST_STATUS" -ne 0 ]; then exit "$TEST_STATUS"; fi
      - name: Commit the narrow fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/_patch-mobile-runtime-guard.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove obsolete desktop contact relocation calls"
          git push origin HEAD:${{ github.ref_name }}
