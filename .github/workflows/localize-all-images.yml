name: Localize all platform images (preview only)

on:
  push:
    branches:
      - fix/localize-all-images-20261019
    paths:
      - '.github/workflows/localize-all-images.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: localize-all-images-preview
  cancel-in-progress: false

jobs:
  localize:
    if: github.ref == 'refs/heads/fix/localize-all-images-20261019'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: fix/localize-all-images-20261019
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image references and rewrite source files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, mimetypes, pathlib, re, urllib.parse, urllib.request, urllib.error, subprocess

          ROOT = pathlib.Path(".")
          OUT = ROOT / "assets" / "images"
          OUT.mkdir(parents=True, exist_ok=True)
          text_exts = {".html", ".htm", ".css", ".js", ".mjs", ".json", ".xml", ".svg", ".md"}
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          files = [ROOT / p for p in tracked if p and pathlib.Path(p).suffix.lower() in text_exts and pathlib.Path(p).is_file()]
          url_re = re.compile(r'https?://[^\s\"\'<>]+', re.I)
          image_context = re.compile(r'(?:src\s*=|srcset\s*=|poster\s*=|url\s*\(|og:image|twitter:image|background(?:-image)?|hero|logo|thumbnail|avatar|image)', re.I)
          replacements = {}
          failed = []
          saved = 0

          def clean_url(s):
              return s.rstrip('),;.!]}')

          def is_local(u):
              p = urllib.parse.urlsplit(u)
              return (p.hostname in {"alabqri.pages.dev", "localhost", "127.0.0.1"} and not p.path.endswith("/api/image-proxy")) or p.path.startswith("/assets/")

          # Gather candidates only where a URL occurs in a likely image-bearing context.
          candidates = {}
          for path in files:
              try: txt = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError): continue
              for m in url_re.finditer(txt):
                  u = clean_url(m.group(0))
                  if is_local(u): continue
                      before = txt[max(0, m.start()-500):m.start()]
                  tag_context = before.rsplit("<", 1)[-1]
                  css_context = before.rsplit(";", 1)[-1]
                  json_context = before.rsplit("{", 1)[-1].rsplit(",", 1)[-1]
                  in_html_image_attr = re.search(r"""(?:src|srcset|poster)\s*=\s*["']?[^"'<>]*$""", tag_context, re.I)
                  in_css_image_url = re.search(r"""url\(\s*["']?[^"'<>]*$""", css_context, re.I)
                  in_image_meta = re.search(r"(?:og:image|twitter:image)", tag_context, re.I)
                  in_image_json = re.search(r"""["'](?:image|imageUrl|image_url|logo|hero|thumbnail|avatar|poster)["']\s*:\s*["']?[^"'<>]*$""", json_context, re.I)
                  if not (in_html_image_attr or in_css_image_url or in_image_meta or in_image_json): continue
                  candidates.setdefault(u, []).append((path, m.start()))

          # Proxy URLs are decoded to their original source and both forms are rewritten.
          expanded = {}
          for u, refs in candidates.items():
              parsed = urllib.parse.urlsplit(u)
              if parsed.path.endswith("/api/image-proxy"):
                  qs = urllib.parse.parse_qs(parsed.query)
                  src = qs.get("src", [None])[0]
                  if src and urllib.parse.urlsplit(src).scheme == "https":
                      expanded.setdefault(src, []).extend(refs)
                      expanded.setdefault(u, []).extend(refs)
              else:
                  expanded.setdefault(u, []).extend(refs)

          for source in sorted(expanded):
              parsed = urllib.parse.urlsplit(source)
              if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
                  failed.append((source, "unsafe URL")); continue
              # Skip URLs which are proxy wrappers: fetch the decoded original instead.
              if parsed.path.endswith("/api/image-proxy"):
                  qs = urllib.parse.parse_qs(parsed.query)
                  actual = qs.get("src", [None])[0]
                  if actual:
                      if actual in replacements:
                          replacements[source] = replacements[actual]
                      continue
              try:
                  req = urllib.request.Request(source, headers={"User-Agent":"ALABQRI-image-localizer/1.0", "Accept":"image/avif,image/webp,image/png,image/jpeg,image/gif,image/svg+xml,*/*;q=0.5"})
                  with urllib.request.urlopen(req, timeout=35) as response:
                      data = response.read(25 * 1024 * 1024 + 1)
                      ctype = response.headers.get("Content-Type", "").split(";")[0].strip().lower()
                  if not data or len(data) > 25 * 1024 * 1024 or not ctype.startswith("image/"):
                      failed.append((source, f"not a valid image response ({ctype}, {len(data)} bytes)")); continue
                  ext = mimetypes.guess_extension(ctype) or ""
                  if ext == ".jpe": ext = ".jpg"
                  if ctype == "image/svg+xml": ext = ".svg"
                  if ext not in {".png", ".jpg", ".jpeg", ".gif", ".webp", ".avif", ".svg", ".bmp", ".tif", ".tiff"}:
                      failed.append((source, f"unsupported image type ({ctype})")); continue
                  # Verify raster signatures; SVG must have an SVG/XML signature.
                  if ext in {".jpg", ".jpeg"} and not data.startswith(b"\xff\xd8\xff"): raise ValueError("JPEG signature mismatch")
                  if ext == ".png" and not data.startswith(b"\x89PNG\r\n\x1a\n"): raise ValueError("PNG signature mismatch")
                  if ext == ".gif" and not data.startswith((b"GIF87a", b"GIF89a")): raise ValueError("GIF signature mismatch")
                  if ext == ".webp" and not (data.startswith(b"RIFF") and data[8:12] == b"WEBP"): raise ValueError("WebP signature mismatch")
                  if ext == ".svg" and b"<svg" not in data[:4096].lower(): raise ValueError("SVG signature mismatch")
                  name = "external-" + hashlib.sha256(source.encode()).hexdigest()[:16] + ext
                  target = OUT / name
                  target.write_bytes(data)
                  local = "/assets/images/" + name
                  replacements[source] = local
                  saved += 1
                  print(f"LOCALIZED {source} -> {local} ({len(data)} bytes)")
              except Exception as e:
                  failed.append((source, str(e)))

          # Resolve wrappers after original source URLs have been downloaded.
          for source in list(expanded):
              parsed = urllib.parse.urlsplit(source)
              if parsed.path.endswith("/api/image-proxy"):
                  actual = urllib.parse.parse_qs(parsed.query).get("src", [None])[0]
                  if actual in replacements: replacements[source] = replacements[actual]

          changed = []
          for path in files:
              try: original = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError): continue
              updated = original
              for source, local in sorted(replacements.items(), key=lambda kv: len(kv[0]), reverse=True):
                  updated = updated.replace(source, local)
              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))
          print(f"\nSUMMARY: {saved} image files saved; {len(replacements)} URL forms mapped; {len(changed)} source files rewritten.")
          if changed: print("REWRITTEN FILES:\n" + "\n".join(changed))
          report = ROOT / "docs" / "image-localization-report.md"
          report.parent.mkdir(parents=True, exist_ok=True)
          lines = ["# ALABQRI image localization report", "", f"- Images saved in this run: {saved}", f"- Source files rewritten: {len(changed)}", "", "## External image references that could not be localized", ""]
          if failed:
              lines += [f"- `{u}` — {reason}" for u, reason in failed]
          else:
              lines.append("- None detected by this run.")
          report.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Commit localized images to preview branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images docs/image-localization-report.md
          git add -u -- .
          if git diff --cached --quiet; then
            echo "No image references could be localized."
            exit 0
          fi
          git commit -m "fix(images): localize platform image assets"
          git push origin HEAD:fix/localize-all-images-20261019
